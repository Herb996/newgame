<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音效试听 · SteamPunkExtraction</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --line:#e3e7ee; --text:#1f2430;
    --dim:#6b7482; --accent:#3c6ff5; --accent-soft:#e8efff; --hot:#ff7043;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
  header{padding:18px 24px 14px;border-bottom:1px solid var(--line);background:var(--card);
         position:sticky;top:0;z-index:9}
  h1{margin:0 0 4px;font-size:17px;font-weight:600}
  .sub{color:var(--dim);font-size:12px}
  .bar{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  button.btn{border:1px solid var(--line);background:#fff;color:var(--text);
             padding:6px 13px;border-radius:7px;cursor:pointer;font-size:13px}
  button.btn:hover{border-color:var(--accent);color:var(--accent)}
  button.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  input[type=range]{width:130px;accent-color:var(--accent)}
  .pill{font-size:12px;color:var(--dim);background:#f0f2f6;border:1px solid var(--line);
        padding:4px 10px;border-radius:20px}
  main{padding:20px 24px 60px;max-width:1080px}
  h2.grp{font-size:13px;color:var(--dim);font-weight:600;margin:22px 0 10px;
         text-transform:none;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:10px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:10px 12px;cursor:pointer;transition:.12s;user-select:none}
  .item:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(60,111,245,.10)}
  .item.playing{border-color:var(--accent);background:var(--accent-soft)}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .name{font-size:13px;font-weight:600;font-family:Consolas,monospace}
  .dur{font-size:11px;color:var(--dim);white-space:nowrap}
  .wave{display:flex;align-items:center;gap:1px;height:30px;margin:8px 0 4px}
  .wave i{flex:1;background:#c8d2e4;border-radius:1px;min-height:1px}
  .item.playing .wave i{background:#9fb8ff}
  .wave i.hot{background:var(--accent)}
  .meta{font-size:11px;color:var(--dim);font-family:Consolas,monospace}
  footer{padding:0 24px 40px;color:var(--dim);font-size:12px;line-height:1.9}
  code{background:#eef1f6;padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>音效试听面板</h1>
  <div class="sub" id="sub">加载中…</div>
  <div class="bar">
    <button class="btn" id="stopBtn">■ 停止</button>
    <button class="btn" id="loopBtn">↻ 循环</button>
    <label class="sub">音量 <input type="range" id="vol" min="0" max="100" value="85"></label>
    <span class="pill" id="stat"></span>
  </div>
</header>
<main id="groups"></main>
<footer>
  Godot 里引用：<code>res://Assets/Audio/sfx/&lt;文件名&gt;</code>，交给 AudioStreamPlayer 直接拖即可。<br>
  重新生成：改 <code>tools/sfx_synth.py</code> 里的参数后重跑，同名文件会被覆盖；本页面刷新即可看到新的波形。
</footer>

<audio id="au"></audio>
<script src="_manifest.js"></script>
<script>
(function () {
  const M = window.SFX_MANIFEST;
  if (!M) {
    document.getElementById('sub').textContent =
      '读不到 _manifest.js —— 请与 sfx 目录一起打开，或先跑一次 tools/sfx_synth.py';
    return;
  }
  const au = document.getElementById('au');
  const vol = document.getElementById('vol');
  const loopBtn = document.getElementById('loopBtn');
  const host = document.getElementById('groups');
  let current = null, looping = false;

  const files = M.groups.reduce((a, g) => a + g.items.length, 0);
  const totalDur = M.groups.reduce((a, g) => a + g.items.reduce((b, i) => b + i.dur, 0), 0);
  document.getElementById('sub').textContent =
    `共 ${files} 个音效 · 合计 ${totalDur.toFixed(1)}s · ${M.sample_rate / 1000}kHz / ` +
    `${M.channels === 1 ? '单声道' : '立体声'} / 16bit WAV · 生成于 ${M.generated}`;

  function fmt(b) { return b < 1024 ? b + ' B' : (b / 1024).toFixed(1) + ' KB'; }

  M.groups.forEach(g => {
    const h = document.createElement('h2');
    h.className = 'grp';
    h.textContent = g.label + '  ·  ' + g.items.length;
    host.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'grid';
    g.items.forEach(it => {
      const el = document.createElement('div');
      el.className = 'item';
      const bars = (it.env || []).map(v =>
        `<i style="height:${Math.max(2, Math.round(v * 100))}%"></i>`).join('');
      el.innerHTML =
        `<div class="top"><span class="name">${it.file.replace('.wav', '')}</span>` +
        `<span class="dur">${it.dur.toFixed(2)}s</span></div>` +
        `<div class="wave">${bars}</div>` +
        `<div class="meta">peak ${it.peak} · ${fmt(it.bytes)}</div>`;
      el.onclick = () => play(el, it);
      grid.appendChild(el);
    });
    host.appendChild(grid);
  });

  function play(el, it) {
    if (current && current !== el) current.classList.remove('playing');
    current = el;
    el.classList.add('playing');
    au.src = it.file;
    au.loop = looping;
    au.volume = vol.value / 100;
    au.currentTime = 0;
    au.play().catch(e => console.warn('播放失败', it.file, e));
    document.getElementById('stat').textContent = '正在播放：' + it.file;
  }

  au.onended = () => { if (current) current.classList.remove('playing'); };
  document.getElementById('stopBtn').onclick = () => {
    au.pause(); au.currentTime = 0;
    if (current) current.classList.remove('playing');
    document.getElementById('stat').textContent = '';
  };
  loopBtn.onclick = () => {
    looping = !looping; au.loop = looping;
    loopBtn.classList.toggle('on', looping);
  };
  vol.oninput = () => { au.volume = vol.value / 100; };
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); document.getElementById('stopBtn').click(); }
  });
})();
</script>
</body>
</html>
